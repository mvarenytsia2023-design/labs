<main>
    <section>
        <h2>Надіслати повідомлення</h2>
        <form action="#" method="post">
            <p>
                <label for="username">Ваше ім'я:</label><br>
                <input type="text" id="username" name="username" required>
            </p>
            <p>
                <label for="useremail">Електронна пошта:</label><br>
                <input type="email" id="useremail" name="useremail" required>
            </p>
            <p>
                <label for="subject">Тема листа:</label><br>
                <input type="text" id="subject" name="subject" required>
            </p>
            <p>
                <label for="message">Текст повідомлення:</label><br>
                <textarea id="message" name="message" rows="6" cols="40" required></textarea>
            </p>
            <p>
                <button type="submit">Надіслати</button>
            </p>
        </form>
    </section>
</main>
